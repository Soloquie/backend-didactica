spring.application.name=portafolio-didactica
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portafolio_didactica}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:CAMBIAR_POR_SECRETO_SEGURO_DE_AL_MENOS_32_CARACTERES}
jwt.expiration=${JWT_EXPIRATION:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:TU_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY:TU_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:TU_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
